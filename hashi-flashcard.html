<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ฮาชิฝึกตา! 👁️</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  :root { --blue:#4D96FF; --purple:#C77DFF; --mint:#6BCB77; --coral:#FF6B6B; --sun:#FFD93D; }
  body { font-family:'Kanit',sans-serif; background:#F0F0F0; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  header { width:100%; background:linear-gradient(135deg,var(--blue),var(--purple)); padding:18px 24px 14px; text-align:center; color:white; box-shadow:0 4px 20px rgba(77,150,255,.3); }
  header h1 { font-size:1.8rem; font-weight:900; }
  header p  { font-size:.95rem; opacity:.9; margin-top:2px; }
  .score-bar { display:flex; gap:6px; margin-top:10px; justify-content:center; flex-wrap:wrap; }
  .star-dot { width:22px; height:22px; border-radius:50%; background:rgba(255,255,255,.3); display:flex; align-items:center; justify-content:center; font-size:14px; transition:all .3s; }
  .star-dot.earned { background:var(--sun); transform:scale(1.2); }
  main { flex:1; width:100%; max-width:480px; padding:18px 14px; display:flex; flex-direction:column; align-items:center; gap:14px; }
  .progress-wrap { width:100%; text-align:center; color:#888; font-size:.9rem; }
  .progress-bar { width:100%; height:10px; background:#E0E0E0; border-radius:99px; margin-top:6px; overflow:hidden; }
  .progress-fill { height:100%; background:linear-gradient(90deg,var(--blue),var(--purple)); border-radius:99px; transition:width .5s ease; }
  .mode-row { display:flex; gap:10px; width:100%; }
  .mode-btn { flex:1; padding:10px; border-radius:14px; border:2px solid #E0E0E0; background:white; font-family:'Kanit',sans-serif; font-size:.9rem; font-weight:700; cursor:pointer; color:#888; transition:all .2s; }
  .mode-btn.active { border-color:var(--blue); color:var(--blue); background:#F0F6FF; }
  .card { width:100%; background:white; border-radius:28px; box-shadow:0 8px 32px rgba(0,0,0,.13); padding:24px 20px 20px; display:flex; flex-direction:column; align-items:center; gap:12px; animation:popIn .4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes popIn { from{transform:scale(.75) translateY(20px);opacity:0} to{transform:scale(1) translateY(0);opacity:1} }
  .card-label { font-size:.85rem; font-weight:700; color:white; background:var(--blue); padding:4px 18px; border-radius:99px; }
  .icon-wrap { width:210px; height:210px; display:flex; align-items:center; justify-content:center; background:white; border:2px solid #EBEBEB; border-radius:16px; overflow:hidden; }
  .icon-wrap img { width:100%; height:100%; object-fit:contain; }
  .word { font-size:2.2rem; font-weight:900; color:#1A1A1A; letter-spacing:2px; }
  .hint { font-size:1rem; color:#aaa; }
  .choices { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .choice-btn { background:white; border:3px solid #E8E8E8; border-radius:16px; padding:10px 6px 8px; font-family:'Kanit',sans-serif; cursor:pointer; transition:all .2s; display:flex; flex-direction:column; align-items:center; gap:5px; box-shadow:0 3px 0 #E0E0E0; color:#2D2D2D; }
  .choice-btn img { width:70px; height:70px; object-fit:contain; }
  .choice-btn span { font-size:.95rem; font-weight:700; }
  .choice-btn:hover { transform:translateY(-3px); box-shadow:0 6px 0 #D0D0D0; }
  .choice-btn.correct { border-color:var(--mint); background:#F0FFF4; animation:bounce .4s ease; }
  .choice-btn.wrong   { border-color:var(--coral); background:#FFF5F5; animation:shake .4s ease; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 40%{transform:translateY(-12px)} }
  @keyframes shake  { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  .feedback { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); align-items:center; justify-content:center; z-index:100; flex-direction:column; gap:12px; }
  .feedback.show { display:flex; }
  .feedback-bubble { background:white; border-radius:32px; padding:28px 36px; text-align:center; animation:popIn .35s cubic-bezier(.34,1.56,.64,1); max-width:300px; }
  .feedback-bubble .big-emoji { font-size:4.5rem; }
  .feedback-bubble .fb-word { font-size:2rem; font-weight:900; margin-top:6px; }
  .feedback-bubble .fb-sub  { font-size:.9rem; color:#888; margin-top:4px; }
  .next-btn { background:linear-gradient(135deg,var(--blue),var(--purple)); color:white; border:none; border-radius:99px; padding:16px 48px; font-family:'Kanit',sans-serif; font-size:1.2rem; font-weight:700; cursor:pointer; box-shadow:0 4px 20px rgba(77,150,255,.35); transition:transform .2s; }
  .next-btn:hover { transform:scale(1.05); }
  .finish-screen { display:none; flex-direction:column; align-items:center; gap:16px; text-align:center; padding:24px 16px; }
  .finish-screen.show { display:flex; }
  .finish-screen .trophy { font-size:6rem; }
  .finish-screen h2 { font-size:2rem; font-weight:900; color:#2D2D2D; }
  .restart-btn { background:linear-gradient(135deg,var(--mint),var(--blue)); color:white; border:none; border-radius:99px; padding:16px 48px; font-family:'Kanit',sans-serif; font-size:1.2rem; font-weight:700; cursor:pointer; margin-top:8px; transition:transform .2s; }
  .restart-btn:hover { transform:scale(1.05); }
  .game-area { width:100%; }
  #flashNext { display:none; justify-content:center; }
</style>
</head>
<body>
<header>
  <h1>👁️ ฮาชิฝึกตา!</h1>
  <p>เรียนรู้รูปภาพสำหรับตรวจตากับหมอ</p>
  <div class="score-bar" id="scoreDots"></div>
</header>
<main>
  <div class="game-area" id="gameArea">
    <div style="display:flex;flex-direction:column;gap:12px;width:100%">
      <div class="progress-wrap">
        <span id="progressText">ข้อ 1 / 9</span>
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:11%"></div></div>
      </div>
      <div class="mode-row">
        <button class="mode-btn active" id="modeQuiz"  onclick="setMode('quiz')">🎯 ทายรูป</button>
        <button class="mode-btn"        id="modeFlash" onclick="setMode('flash')">📖 ดูการ์ด</button>
      </div>
      <div class="card" id="card">
        <span class="card-label" id="cardLabel">ดูรูปนี้คืออะไร?</span>
        <div class="icon-wrap"><img id="cardImg" src="" alt=""/></div>
        <div class="word" id="cardWord"  style="display:none"></div>
        <div class="hint" id="cardHint" style="display:none"></div>
      </div>
      <div class="choices" id="choicesArea"></div>
      <div id="flashNext"><button class="next-btn" onclick="nextCard()">ถัดไป →</button></div>
    </div>
  </div>
  <div class="finish-screen" id="finishScreen">
    <div class="trophy">🏆</div>
    <h2>เก่งมากเลย ฮาชิ!</h2>
    <p id="finishScore"></p>
    <p style="font-size:.9rem;color:#aaa">พร้อมไปตรวจตากับหมอแล้ว! 😊</p>
    <button class="restart-btn" onclick="restart()">🔄 เล่นอีกรอบ</button>
  </div>
</main>
<div class="feedback" id="feedback">
  <div class="feedback-bubble">
    <div class="big-emoji" id="fbEmoji">🌟</div>
    <div class="fb-word"   id="fbWord"></div>
    <div class="fb-sub"    id="fbSub"></div>
  </div>
  <button class="next-btn" onclick="nextCard()">ถัดไป →</button>
</div>

function shuffle(a){ return [...a].sort(()=>Math.random()-.5); }

function setMode(m){
  mode=m;
  document.getElementById('modeQuiz').classList.toggle('active',m==='quiz');
  document.getElementById('modeFlash').classList.toggle('active',m==='flash');
  restart();
}
function restart(){
  order=shuffle(cards); current=0; score=0; answered=false;

  buildDots(); renderCard();
}
function buildDots(){
  const el=document.getElementById('scoreDots'); el.innerHTML='';
  order.forEach((_,i)=>{ const d=document.createElement('div'); d.className='star-dot'; d.id='dot-'+i; el.appendChild(d); });
}
function renderCard(){
  answered=false;
  const c=order[current], total=order.length;
  document.getElementById('progressText').textContent=`ข้อ ${current+1} / ${total}`;
  document.getElementById('progressFill').style.width=((current+1)/total*100)+'%';
  document.getElementById('cardImg').src=IMGS[c.key];
  if(mode==='flash'){
    document.getElementById('cardLabel').textContent='รูปนี้คือ...';
    document.getElementById('cardWord').style.display='block';
    document.getElementById('cardWord').textContent=c.word;
    document.getElementById('cardHint').style.display='block';
    document.getElementById('cardHint').textContent='('+c.hint+')';
    document.getElementById('choicesArea').style.display='none';
    document.getElementById('flashNext').style.display='flex';
  } else {
    document.getElementById('cardLabel').textContent='ดูรูปนี้คืออะไร?';
    document.getElementById('cardWord').style.display='none';
    document.getElementById('cardHint').style.display='none';
    document.getElementById('flashNext').style.display='none';
    document.getElementById('choicesArea').style.display='grid';
    buildChoices(c);
  }
  const card=document.getElementById('card');
  card.style.animation='none'; void card.offsetWidth;
  card.style.animation='popIn .4s cubic-bezier(.34,1.56,.64,1)';
}
function buildChoices(correct){
  const others=shuffle(cards.filter(c=>c.key!==correct.key)).slice(0,3);
  const opts=shuffle([correct,...others]);
  const area=document.getElementById('choicesArea'); area.innerHTML='';
  opts.forEach(opt=>{
    const btn=document.createElement('button');
    btn.className='choice-btn';
    const img=document.createElement('img');
    img.src=IMGS[opt.key]; img.alt=opt.word;
    const lbl=document.createElement('span');
    lbl.textContent=opt.word;
    btn.appendChild(img); btn.appendChild(lbl);
    btn.onclick=()=>handleAnswer(opt,correct,btn);
    area.appendChild(btn);
  });
}
function handleAnswer(chosen,correct,btn){
  if(answered)return; answered=true;
  const ok=chosen.key===correct.key;
  if(ok){
    score++;
    btn.classList.add('correct');
    const dot=document.getElementById('dot-'+current);
    if(dot){dot.classList.add('earned');dot.textContent='⭐';}
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.choice-btn').forEach(b=>{
      if(b.querySelector('span').textContent===correct.word) b.classList.add('correct');
    });
  }
  showFeedback(ok,correct);
}
function showFeedback(ok,card){
  document.getElementById('fbEmoji').textContent=ok?'🌟':'💪';
  document.getElementById('fbWord').textContent=ok?'เก่งมาก!':card.word;
  document.getElementById('fbSub').textContent=ok
    ?`ใช่เลย! คือ "${card.word}"`
    :`รูปนี้คือ "${card.word}" (${card.hint})`;
  document.getElementById('feedback').classList.add('show');
}
function nextCard(){
  document.getElementById('feedback').classList.remove('show');
  current++;
  if(current>=order.length) showFinish(); else renderCard();
}
function showFinish(){
  document.getElementById('gameArea').style.display='none';
  document.getElementById('finishScreen').classList.add('show');
  const pct=Math.round(score/order.length*100);
  document.getElementById('finishScore').textContent=
    pct===100?'⭐ เก่งสุดๆ ตอบถูกทุกข้อ!':
    pct>=70?`ตอบถูก ${score} จาก ${order.length} ข้อ เก่งมาก!`:
            `ตอบถูก ${score} จาก ${order.length} ข้อ ลองอีกครั้งนะ!`;
}
restart();
</script>
</body>
</html>
